name: Release Go

on:
  workflow_dispatch:
    inputs:
      version:
        description: Go module version, e.g. v0.2.0
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v1.2.3, got $VERSION"; exit 1; }
          git tag "go/$VERSION"
          git push origin "go/$VERSION"
