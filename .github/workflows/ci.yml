name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  js:
    name: JS / eslint ${{ matrix.eslint }} / typescript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint: ["9.39", "10"]
        typescript: ["5.9", "6.0"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -w -D typescript@~${{ matrix.typescript }}
      - run: pnpm --filter eslint-plugin-tenets add -D eslint@^${{ matrix.eslint }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test ./...
