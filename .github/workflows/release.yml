name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - run: go vet ./... && go test ./...
        working-directory: go
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            version=$(node -p "require('./$pkg').version")
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag v$tag does not match $pkg version $version"
              exit 1
            fi
          done
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish npm packages
        run: |
          for dir in packages/*/; do
            (cd "$dir" && npm publish --access public --provenance)
          done
      - name: Tag Go module
        working-directory: .
        run: |
          git tag "go/$GITHUB_REF_NAME"
          git push origin "go/$GITHUB_REF_NAME"
